[Service]
ExecStartPre=/bin/sh -c '/usr/sbin/iptables -w 5 -N DOCKER-USER 2>/dev/null || /usr/sbin/iptables -w 5 -S DOCKER-USER >/dev/null'
ExecStartPre=/bin/sh -c '/usr/sbin/iptables -w 5 -C DOCKER-USER -d 169.254.169.254/32 -j REJECT 2>/dev/null || /usr/sbin/iptables -w 5 -I DOCKER-USER -d 169.254.169.254/32 -j REJECT'
